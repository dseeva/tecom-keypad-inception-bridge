; Tecom keypad <-> Inner Range Inception bridge for ESP32
; Build:  pio run          Flash:  pio run -t upload          Serial log:  pio device monitor

[env:esp32dev]
platform = espressif32@5.3.0
board = esp32dev
framework = arduino
; bigger app partition (1.9 MB) so the firmware fits with room for over-the-air updates
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
